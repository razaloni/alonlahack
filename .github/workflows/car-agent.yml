name: Car search agent

on:
  schedule:
    - cron: "17 5-20/3 * * *"   # every 3 hours, ~08:17-23:17 Israel time
  workflow_dispatch: {}          # "Run workflow" button for a manual run

permissions:
  contents: write                # to save car-agent/seen.json (no duplicate alerts)

concurrency:
  group: car-agent
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m unittest car-agent/test_agent.py

      - name: Search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python car-agent/agent.py

      - name: Save seen listings
        if: always()
        run: |
          git config user.name "car-agent-bot"
          git config user.email "car-agent-bot@users.noreply.github.com"
          git add car-agent/seen.json
          git diff --cached --quiet || (git commit -m "car-agent: update seen listings" && git push)
